name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  GODOT_VERSION: 4.4-stable

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - run: tools/lint.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - run: tools/run_tests.sh unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-unit
          path: reports/

  integration:
    name: Integration tests
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - run: tools/run_tests.sh integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-integration
          path: reports/

  system:
    name: System tests (${{ matrix.shard }})
    needs: [integration]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: lap-islamabad
            args: --file=full_lap --filter=lap_islamabad
          - shard: lap-washington
            args: --file=full_lap --filter=lap_washington
          - shard: lap-rawalakot
            args: --file=full_lap --filter=lap_rawalakot
          - shard: lap-tokyo
            args: --file=full_lap --filter=lap_tokyo
          - shard: lap-new_york
            args: --file=full_lap --filter=lap_new_york
          - shard: lap-coverage
            args: --file=full_lap --filter=every_map
          - shard: gameplay
            args: --exclude-file=full_lap
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - run: tools/run_tests.sh system ${{ matrix.args }}
        env:
          REPORT_NAME: system-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-system-${{ matrix.shard }}
          path: reports/
