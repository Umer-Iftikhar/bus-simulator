name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  GODOT_VERSION: 4.4-stable

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - run: tools/lint.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - run: tools/run_tests.sh unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-unit
          path: reports/

  integration:
    name: Integration tests
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - run: tools/run_tests.sh integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-integration
          path: reports/

  system:
    name: System tests
    needs: [integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - run: tools/run_tests.sh system
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-system
          path: reports/
